<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 sm:p-4">
    <div class="max-w-7xl mx-auto">
        <!-- 右上の集計時刻 -->
        <div class="flex justify-end mb-3">
            <div class="bg-slate-800 text-slate-300 text-[10px] font-semibold px-2.5 py-1 rounded-full border border-slate-700">
                <span>🕒 集計時刻:</span>
                <span id="update-time" class="text-white font-bold">読み込み中...</span>
            </div>
        </div>
        
        <!-- 都市別グリッド -->
        <div id="city-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>

    <script>
        fetch('weather.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('update-time').textContent = data.updated_at || '不明';
                const cityGrid = document.getElementById('city-grid');
                cityGrid.innerHTML = '';

                data.cities.forEach(city => {
                    let stationsHtml = '';

                    city.stations.forEach(station => {
                        let timesHtml = '';
                        station.forecasts.forEach(f => {
                            timesHtml += `
                                <div class="text-center bg-slate-800/80 p-1.5 rounded border border-slate-700">
                                    <div class="text-[9px] text-slate-400">${f.time}</div>
                                    <div class="text-base my-0.5">${f.weather}</div>
                                    <div class="text-[11px] font-bold text-slate-200">${f.temp}</div>
                                </div>
                            `;
                        });

                        stationsHtml += `
                            <div class="mb-2 last:mb-0">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-slate-400 text-[9px] font-bold px-1.5 py-0.5">${station.name}</span>
                                </div>
                                <div class="grid grid-cols-4 gap-1">
                                    ${timesHtml}
                                </div>
                            </div>
                        `;
                    });

                    const cityCard = document.createElement('div');
                    cityCard.className = "bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-md flex flex-col justify-between";
                    cityCard.innerHTML = `
                        <div class="border-b border-slate-700 pb-2 mb-2 flex justify-between items-center">
                            <h2 class="font-bold text-sm text-white tracking-wider">📍 ${city.name}</h2>
                        </div>
                        <div class="space-y-2">
                            ${stationsHtml}
                        </div>
                    `;
                    cityGrid.appendChild(cityCard);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('update-time').textContent = 'データ取得失敗';
            });
    </script>
</body>
</html>
