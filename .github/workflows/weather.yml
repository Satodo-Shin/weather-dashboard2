name: Auto Update Weather

on:
  schedule:
    - cron: '0 21,3,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytz

      - name: Run scraper script
        run: |
          python scrape_weather.py

      - name: Commit and push weather.json
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github-actions
          message: "Auto-update weather data"
          add: "weather.json"
          push: true
