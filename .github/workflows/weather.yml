name: Auto Update Weather

on:
  schedule:
    - cron: '0 21,3,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytz

      - name: Run scraper script
        run: |
          python scrape_weather.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.github.io"
          
          # リモートの最新情報を取得して同期
          git fetch origin main
          git rebase origin/main || true
          
          git add weather.json
          git diff --staged --quiet || (git commit -m "Auto-update weather data: $(date +'%Y-%m-%d %H:%M')" && git push origin HEAD:main)
